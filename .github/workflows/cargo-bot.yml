
name: Cargo Bot

on:
  workflow_dispatch:

jobs:
  cargo:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install discord.py

      - name: Start bot
        run: python bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          ROLE: ${{ secrets.ROLE }}
